[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eass"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "pefile>=2023.2.7",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.18",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "yara-python>=4.5,<5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]
ml = ["lightgbm>=4.6,<5", "numpy>=2.1,<3"]
train = ["lightgbm>=4.6,<5", "numpy>=2.1,<3", "scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["eass*", "experiments*", "scripts*"]

[tool.setuptools.package-data]
"eass.report" = ["attack_map.json", "prompts/*.txt"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/tests"]

