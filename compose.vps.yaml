services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://eass:${EASS_DB_PASSWORD:?}@postgres:5432/eass
      EASS_API_KEY: ${EASS_API_KEY:?}
      REPORTS_ENABLED: ${EASS_VPS_REPORTS_ENABLED:-false}
    restart: unless-stopped

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://eass:${EASS_DB_PASSWORD:?}@postgres:5432/eass
      REPORTS_ENABLED: ${EASS_VPS_REPORTS_ENABLED:-false}
      OFFLINE_MODE: ${EASS_VPS_OFFLINE_MODE:-true}
      LLM_BASE_URL: ${EASS_VPS_LLM_BASE_URL:-http://ollama:11434/v1}
    restart: unless-stopped

  icap:
    environment:
      DATABASE_URL: postgresql+psycopg://eass:${EASS_DB_PASSWORD:?}@postgres:5432/eass
      REPORTS_ENABLED: ${EASS_VPS_REPORTS_ENABLED:-false}
    restart: unless-stopped

  hash-updater:
    environment:
      MALWAREBAZAAR_AUTH_KEY: ${MALWAREBAZAAR_AUTH_KEY:?}

  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://eass:${EASS_DB_PASSWORD:?}@postgres:5432/eass

  postgres:
    environment:
      POSTGRES_PASSWORD: ${EASS_DB_PASSWORD:?}
    restart: unless-stopped

  redis:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      EASS_DOMAIN: ${EASS_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
